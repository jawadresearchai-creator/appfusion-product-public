name: iOS Journey J1 Acceptance

on:
  pull_request:
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - '.github/workflows/ios-j1-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - 'shared/**'
      - '.github/workflows/ios-j1-acceptance.yml'

concurrency:
  group: ios-j1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ github.event.repository.private == false && github.repository == 'jawadresearchai-creator/appfusion-product-public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out clean-room Product repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify public-source and clean-room boundaries
        run: python scripts/verify_product.py

  ios-j1:
    needs: preflight
    if: ${{ github.event.repository.private == false && github.repository == 'jawadresearchai-creator/appfusion-product-public' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out clean-room Product repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.5.0'
          cache-disabled: true
      - name: Link the exact iOS Simulator framework under test
        run: >-
          gradle --no-daemon --stacktrace
          :shared:iosSimulatorArm64Test
          :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Run installed iOS Journey J1
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK="$PWD/shared/build/bin/iosSimulatorArm64/debugFramework/AppFusionShared.framework"
          test -d "$FRAMEWORK"
          grep -n 'AppleDocumentJourneyRuntime' "$FRAMEWORK/Headers/AppFusionShared.h"

          RUNTIME="$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))
          candidates = [r for r in payload['runtimes'] if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]
          if not candidates:
              raise SystemExit('No available iOS simulator runtime')
          def ver(r):
              return tuple(int(p) for p in r.get('version','0').split('.'))
          print(max(candidates, key=ver)['identifier'])
          PY
          )"
          DEVICE_TYPES="$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','-j']))
          ids = [d['identifier'] for d in payload['devicetypes'] if d.get('name','').startswith('iPhone')]
          for identifier in reversed(ids):
              print(identifier)
          PY
          )"
          UDID=''
          while IFS= read -r DEVICE_TYPE; do
            if [ -n "$DEVICE_TYPE" ] && CANDIDATE="$(xcrun simctl create AppFusionJourneyJ1 "$DEVICE_TYPE" "$RUNTIME" 2>/dev/null)"; then
              UDID="$CANDIDATE"
              break
            fi
          done <<< "$DEVICE_TYPES"
          test -n "$UDID"

          cleanup_simulator() {
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
          }
          trap cleanup_simulator EXIT

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          DERIVED="$RUNNER_TEMP/appfusion-ios-j1-derived"
          RESULT="$RUNNER_TEMP/AppFusion-iOS-J1.xcresult"
          rm -rf "$DERIVED" "$RESULT"
          xcodebuild \
            -project iosApp/AppFusion.xcodeproj \
            -scheme AppFusion \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$RESULT" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            ONLY_ACTIVE_ARCH=YES \
            clean test

          APP="$DERIVED/Build/Products/Debug-iphonesimulator/AppFusion.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$RUNNER_TEMP/AppFusion-ios-j1-tested-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RESULT" \
            "$RUNNER_TEMP/AppFusion-iOS-J1.xcresult.zip"

          xcrun simctl spawn "$UDID" log show \
            --last 10m \
            --style compact \
            --predicate 'process == "AppFusion" OR process CONTAINS "AppFusionUITests"' \
            > "$RUNNER_TEMP/AppFusion-iOS-J1.log" || true

          (
            cd "$RUNNER_TEMP"
            shasum -a 256 \
              AppFusion-ios-j1-tested-simulator.zip \
              AppFusion-iOS-J1.xcresult.zip \
              AppFusion-iOS-J1.log \
              > AppFusion-iOS-J1.sha256
          )
          echo 'APPFUSION_IOS_J1=PASS'
      - name: Upload iOS Journey J1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AppFusion-iOS-J1-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ runner.temp }}/AppFusion-ios-j1-tested-simulator.zip
            ${{ runner.temp }}/AppFusion-iOS-J1.xcresult.zip
            ${{ runner.temp }}/AppFusion-iOS-J1.xcresult
            ${{ runner.temp }}/AppFusion-iOS-J1.log
            ${{ runner.temp }}/AppFusion-iOS-J1.sha256
      - name: Emit iOS J1 failure evidence
        if: failure()
        shell: bash
        run: |
          find shared/build/test-results -type f -name '*.xml' -print -exec cat {} \; || true
          find "$RUNNER_TEMP/appfusion-ios-j1-derived/Logs/Test" -type f -maxdepth 2 -print 2>/dev/null || true
